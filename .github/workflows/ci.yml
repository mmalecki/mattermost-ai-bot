name: CI

on:
  push:
    branches: [latest]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Installs the package as npm would, outside this checkout and without the lockfile, and runs its
      # bin: every module loads, and it stops only for want of configuration.
      - name: Package works when installed
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/installed" && cd "$RUNNER_TEMP/installed"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/mmalecki-mattermost-ai-bot-*.tgz
          if out=$(npx --no-install mattermost-ai-bot 2>&1); then echo "$out"; exit 1; fi
          echo "$out"
          grep -q 'MATTERMOST_URL is not set' <<< "$out"

  # Builds on pull requests, and publishes to ghcr.io/<owner>/<repo> on pushes: the `latest` branch is
  # tagged `latest`, `v*` tags by their version, and every push by its commit.
  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
